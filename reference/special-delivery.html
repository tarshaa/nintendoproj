<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Special Delivery</title><style>*{box-sizing:border-box}body{margin:0;background:#20251e;display:grid;place-items:center;height:100vh;font:14px monospace}main{position:relative;width:min(100vw,133vh);aspect-ratio:4/3}canvas{width:100%;height:100%;image-rendering:pixelated}#hud{position:absolute;top:3%;left:3%;right:3%;display:flex;justify-content:space-between}#hud span,#hint,button{background:#fff6cd;border:2px solid #222;padding:8px;font:inherit}#hint{position:absolute;bottom:2%;left:3%;right:3%;text-align:center}#overlay{position:absolute;inset:0;background:#bff3a1ed;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}h1{font-size:clamp(24px,5vw,48px);text-shadow:3px 3px #f5b8f7}p{line-height:1.8}button{cursor:pointer;touch-action:none}#play{background:#54df24;min-width:150px}#controls{position:absolute;bottom:16%;left:3%;right:3%;display:flex;justify-content:space-between}#menu{position:absolute;right:3%;top:13%}.hidden{display:none!important}</style><main><canvas id="game" width="512" height="384" tabindex="0"></canvas><div id="hud"><span>RETURN THE BAG ↑</span><span id="progress">0 / 3</span><span id="weather">☀ CALM</span></div><div id="menu"><button id="pause">Ⅱ</button><button id="restart">↻</button></div><div id="controls"><div><button data-key="a">←</button><button data-key="w">↑</button><button data-key="s">↓</button><button data-key="d">→</button></div><div><button data-key="shift">DUCK</button><button data-key=" ">JUMP / GLIDE</button></div></div><div id="hint">↑ move · Space jump / hold glide · Shift hold duck</div><div id="overlay"><h1 id="title">Return the bag.</h1><p id="instructions">Bring it to the person at the green doorway.<br>↑ / WASD move · Space jump / hold to glide<br>Hold Shift while moving to duck.<br>Watch for changing wind.</p><button id="play">Play →</button></div></main><script>
const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d'),k=new Set();let mode='ready',p={x:0,z:2,y:0,v:0},cp=0,cam=2,time=0,last=0,weather=0,wt=8,reward=0;const checkpoints=[2,20,32,48],gaps=[[13,16],[36,43],[49,52]];
function start(){mode='play';$('overlay').classList.add('hidden');c.focus()}function reset(){p={x:0,z:2,y:0,v:0};cp=0;cam=2;time=0;weather=0;wt=8;start()}function pause(){if(mode==='play'){mode='pause';k.clear();$('title').textContent='Paused';$('instructions').textContent='Your delivery can wait.';$('play').textContent='Resume →';$('overlay').classList.remove('hidden')}else if(mode==='pause')start()}
$('play').onclick=()=>mode==='win'?reset():start();$('pause').onclick=pause;$('restart').onclick=reset;
function press(key){key=({arrowup:'w',arrowdown:'s',arrowleft:'a',arrowright:'d'})[key]||key;if(key==='p'){pause();return}if(key===' '&&p.y===0&&mode==='play'){p.y=.01;p.v=10}k.add(key)}function release(key){k.delete(({arrowup:'w',arrowdown:'s',arrowleft:'a',arrowright:'d'})[key]||key)}
addEventListener('keydown',e=>{if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(!e.repeat)press(e.key.toLowerCase())});addEventListener('keyup',e=>release(e.key.toLowerCase()));addEventListener('blur',()=>{k.clear();if(mode==='play')pause()});document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>release(b.dataset.key)});
function duck(){return k.has('shift')||(p.z>26&&p.z<29&&p.y<1)}function tick(dt){time+=dt;wt-=dt;if(wt<0){weather=(weather+1)%3;wt=7+Math.random()*5}let dx=Number(k.has('d'))-Number(k.has('a')),dz=Number(k.has('w'))-Number(k.has('s')),len=Math.hypot(dx,dz)||1,speed=duck()?3.8:weather===1?9:8,nz=Math.max(1,p.z+dz/len*speed*dt);if(!k.has('shift')&&((p.z<=26&&nz>26)||(p.z>=29&&nz<29)))nz=p.z;p.z=nz;p.x+=dx/len*speed*dt;if(weather===2&&p.z>18&&!duck())p.x+=1.8*dt;let glide=k.has(' ')&&p.y>0&&!duck();if(glide&&p.z>35&&p.z<45&&p.y<4)p.v=Math.max(p.v,2);if(p.y>0){p.v-=(glide?5:22)*dt;if(glide)p.v=Math.max(-1.6,p.v);p.y=Math.max(0,p.y+p.v*dt);if(!p.y)p.v=0}if(Math.abs(p.x)>5.2||(p.y===0&&gaps.some(([a,b])=>p.z>a&&p.z<b)))p={x:0,z:checkpoints[cp],y:0,v:0};for(let i=1;i<4;i++)if(p.z>=checkpoints[i]&&!p.y)cp=Math.max(cp,i);cam+=(p.z-cam)*Math.min(1,dt*5);$('progress').textContent=cp+' / 3';$('weather').textContent=['☀ CALM','≈ TAILWIND','≋ CROSSWIND'][weather]+(wt<3?' · CHANGE IN '+Math.ceil(wt)+'s':'');$('hint').textContent=p.z<11?'↑ / W forward · ← → steer · Space jump':p.z<18?'Hold ↑ and tap SPACE before the gap':p.z<30?'Hold SHIFT + ↑ together to pass under':p.z<46?'Hold ↑ + SPACE to open the bag and glide':p.z<54?'One last jump — hold ↑ + SPACE':'Bring the bag to the waiting person';if(p.z>=65&&Math.abs(p.x)<2.3&&!p.y){mode='reward';reward=0;k.clear();$('hint').textContent='♥'}}
function proj(x,z,y=0){return [Math.round(256+x*22+(z-cam)*5),Math.round(280-(z-cam)*13-y*21)]}function poly(a,col){g.beginPath();a.forEach((v,i)=>i?g.lineTo(...v):g.moveTo(...v));g.closePath();g.fillStyle=col;g.fill();g.strokeStyle='#243026';g.stroke()}function floor(a,b,z,d,h,col){poly([proj(a,z,h),proj(b,z,h),proj(b,z+d,h),proj(a,z+d,h)],col)}function box(x,z,w,d,h){poly([proj(x,z),proj(x+w,z),proj(x+w,z,h),proj(x,z,h)],'#efb0e8');poly([proj(x+w,z),proj(x+w,z+d),proj(x+w,z+d,h),proj(x+w,z,h)],'#cf83c1');floor(x,x+w,z,d,h,'#ffd0f7')}

function brickFace(pts,color){poly(pts,color);g.save();g.beginPath();pts.forEach((q,i)=>i?g.lineTo(...q):g.moveTo(...q));g.closePath();g.clip();let xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);g.strokeStyle='#efc7a5';g.lineWidth=1;for(let y=Math.floor(y0/7)*7;y<y1;y+=7){g.beginPath();g.moveTo(x0,y);g.lineTo(x1,y);g.stroke();for(let x=Math.floor(x0/17)*17+(Math.round(y/7)%2)*8;x<x1;x+=17){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+7);g.stroke();}}g.restore()}
function windowAt(x,z,y,w=24,h=36){let q=proj(x,z,y);g.fillStyle='#242d36';g.fillRect(q[0]-2,q[1]-h-2,w+4,h+4);g.fillStyle='#a6d5eb';g.fillRect(q[0],q[1]-h,w,h);g.fillStyle='#d2eaf1';g.fillRect(q[0]+3,q[1]-h+3,4,h-6);g.fillStyle='#33404b';g.fillRect(q[0]+w/2-1,q[1]-h,2,h);g.fillRect(q[0],q[1]-h/2,w,2);g.fillStyle='#d1d5c4';g.fillRect(q[0]-3,q[1],w+6,4)}
function building(z){const x=-10.7,w=4,d=7,h=7;brickFace([proj(x,z),proj(x+w,z),proj(x+w,z,h),proj(x,z,h)],'#b66051');brickFace([proj(x+w,z),proj(x+w,z+d),proj(x+w,z+d,h),proj(x+w,z,h)],'#964f46');floor(x,x+w,z,d,h,'#676979');windowAt(-9.9,z,3,22,36);windowAt(-8.4,z,3,22,36);windowAt(-9.9,z,5.5,22,32);windowAt(-8.4,z,5.5,22,32);let q=proj(-6.8,z,0);g.strokeStyle='#784736';g.lineWidth=3;g.beginPath();g.moveTo(q[0],q[1]);g.lineTo(...proj(-6.8,z,7));g.stroke();g.lineWidth=1;if(z%24===0){let a=proj(-10.4,z,7),b=proj(-6.8,z,7),top=proj(-8.6,z,10);poly([a,top,b],'#eee3cb');g.strokeStyle='#5a473f';g.lineWidth=4;g.beginPath();g.moveTo(...a);g.lineTo(...top);g.lineTo(...b);g.moveTo(top[0],top[1]);g.lineTo(...proj(-8.6,z,7));g.stroke();g.lineWidth=1;}}
function bush(x,z,flowers=false){let q=proj(x,z);for(let i=0;i<5;i++){g.fillStyle=['#315d36','#437b43','#568d48'][i%3];g.fillRect(q[0]-15+i*5,q[1]-17-(i%2)*7,13,20);}if(flowers)for(let i=0;i<4;i++){let xx=q[0]-12+i*8,yy=q[1]-20-(i%2)*8;g.fillStyle=i%2?'#ecc5c9':'#e3e6a8';g.fillRect(xx-3,yy-4,7,7);g.fillStyle='#f6edcc';g.fillRect(xx-1,yy-2,2,2)}}
function person(x,z,y,col,recipient=false){let [sx,sy]=proj(x,z,y),crouch=!recipient&&duck(),h=crouch?29:43;g.fillStyle='#31443166';g.fillRect(sx-12,sy-2,29,5);g.fillStyle='#eecba6';g.fillRect(sx-8,sy-h,16,15);g.fillStyle='#282a2c';g.fillRect(sx-9,sy-h-3,18,7);g.fillRect(sx-10,sy-h+2,3,5);if(recipient){g.fillRect(sx-8,sy-h+7,7,4);g.fillRect(sx+1,sy-h+7,7,4);g.fillRect(sx-1,sy-h+8,2,1)}else{g.fillRect(sx-4,sy-h+8,2,2);g.fillRect(sx+4,sy-h+8,2,2)}g.fillStyle=col;g.fillRect(sx-11,sy-h+15,22,h-23);g.fillStyle=recipient?'#3d7bd6':'#6363ab';g.fillRect(sx-10,sy-10,8,7);g.fillRect(sx+3,sy-10,8,7);g.fillStyle='#e4dec8';g.fillRect(sx-12,sy-3,10,4);g.fillRect(sx+3,sy-3,10,4)}
function ac(z){const q=proj(-6.1,z,1.8);g.fillStyle='#4b5555';g.fillRect(q[0]-3,q[1]-24,31,26);g.fillStyle='#e2dfc8';g.fillRect(q[0],q[1]-23,29,25);g.fillStyle='#717878';g.fillRect(q[0]+3,q[1]-20,20,17);g.fillStyle='#b8c5bf';for(let i=0;i<6;i++)g.fillRect(q[0]+4,q[1]-18+i*3,18,1);g.fillStyle='#354945';g.fillRect(q[0]+25,q[1]-8,2,3);g.strokeStyle='#edfaff';for(let i=0;i<5;i++){let a=(time*60+i*27)%145;g.beginPath();g.moveTo(q[0]+32+a,q[1]-8+i*3);g.lineTo(q[0]+48+a,q[1]-12+i*3);g.stroke();}}
function draw(){g.fillStyle=weather===2?'#9ca3c3':'#7cb7ef';g.fillRect(0,0,512,384);g.fillStyle='#d5edb3';g.fillRect(0,125,512,259);for(let z=Math.min(75,Math.ceil(cam+22));z>Math.max(-3,cam-10);z--){floor(-13,13,z,1,-.3,'#8dbb70');let hole=gaps.some(([a,b])=>z>=a&&z<b);floor(-5.2,5.2,z,1,0,hole?'#3c4846':z%4===0?'#bac3b8':'#d4d5bc');if(!hole){floor(-5.8,-5.2,z,1,.25,'#b87163');floor(5.2,5.8,z,1,.25,'#b87163');}floor(6,11,z,1,-.1,'#597644');}let o=[];for(let z=0;z<75;z+=12)o.push({z,fn:()=>building(z)});for(let z=0;z<75;z+=3){o.push({z,fn:()=>bush(7+(z%2),z,z%6===0)});if(z%6===0)o.push({z,fn:()=>bush(-6.7,z,true)})}o.push({z:27,fn:()=>{for(let x=-5;x<5;x++)floor(x,x+1,26,3,1.5,x%2?'#216d67':'#a9d5b6');for(let x=-5;x<5;x++){let q=proj(x,26,1.5);g.fillStyle=x%2?'#216d67':'#a9d5b6';g.fillRect(q[0],q[1],22,6);g.fillRect(q[0]+3,q[1]+6,16,3);}g.strokeStyle='#333e33';g.beginPath();g.moveTo(...proj(-5,26));g.lineTo(...proj(-5,26,1.5));g.stroke()}});for(let z=36;z<45;z+=4)o.push({z,fn:()=>ac(z)});o.push({z:67,fn:()=>{brickFace([proj(-2.5,67),proj(2.5,67),proj(2.5,67,5),proj(-2.5,67,5)],'#b56755');let q=proj(-1,67);g.fillStyle='#304d41';g.fillRect(q[0]-3,q[1]-65,51,68);g.fillStyle='#64ab74';g.fillRect(q[0],q[1]-62,45,62);g.strokeStyle='#2d5140';g.strokeRect(q[0]+5,q[1]-55,35,22);g.strokeRect(q[0]+5,q[1]-27,35,22);g.fillStyle='#f2d998';g.fillRect(q[0]+36,q[1]-31,3,3)}});for(let i=1;i<4;i++)o.push({z:checkpoints[i],fn:()=>{let q=proj(4.5,checkpoints[i]);g.fillStyle='#324532';g.fillRect(q[0],q[1]-29,2,29);g.fillStyle=cp>=i?'#70e245':'#fff5b0';g.fillRect(q[0]+2,q[1]-29,13,9)}});o.push({z:65,fn:()=>person(0,65,mode==='reward'?Math.max(0,Math.sin(reward*7))*.5:0,'#322c39',true)});o.push({z:p.z,fn:()=>{person(p.x,p.z,p.y,'#ed9bd7');let q=proj(p.x,p.z,p.y);g.fillStyle='#fff6dd';g.fillRect(q[0]+13,q[1]-22,12,19);g.strokeStyle='#fff6dd';g.strokeRect(q[0]+15,q[1]-27,7,7);g.fillStyle='#dd6464';g.fillRect(q[0]+16,q[1]-16,6,2);if(k.has(' ')&&p.y){poly([[q[0]-28,q[1]-52],[q[0]-20,q[1]-75],[q[0]+20,q[1]-75],[q[0]+28,q[1]-52]],'#fff9e5');g.beginPath();g.moveTo(q[0]-24,q[1]-52);g.lineTo(q[0],q[1]-25);g.lineTo(q[0]+24,q[1]-52);g.stroke()}}});o.sort((a,b)=>b.z-a.z).forEach(a=>{if(a.z>cam-12&&a.z<cam+24)a.fn()});if(weather===2){g.strokeStyle='#edf6ff99';for(let i=0;i<22;i++){let xx=(i*39+time*90)%512,yy=(i*47+time*120)%384;g.beginPath();g.moveTo(xx,yy);g.lineTo(xx+5,yy+9);g.stroke()}}if(mode==='reward'||mode==='win'){let q=proj(0,65);for(let i=0;i<7;i++){let x=q[0]+Math.cos(i)*22,y=q[1]-25-Math.abs(Math.sin(i))*24;g.strokeStyle='#358d22';g.beginPath();g.moveTo(q[0],q[1]-8);g.lineTo(x,y);g.stroke();g.fillStyle=i%2?'#fff7af':'#f49dde';g.fillRect(x-6,y-2,12,4);g.fillRect(x-2,y-6,4,12)}}}
function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;if(mode==='play')tick(dt);if(mode==='reward'){reward+=dt;if(reward>4){mode='win';$('title').textContent='It was for you.';$('instructions').textContent='♥';$('play').textContent='Play again ↻';$('overlay').classList.remove('hidden')}}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
