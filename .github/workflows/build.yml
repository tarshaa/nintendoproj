name: Build DSi app
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  network-build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds@sha256:779f6193d1030c62e60d1f0f39c3e32cf4045c0bd224a45c0ceadf9d9ab01a51
    steps:
      - uses: actions/checkout@v4
      - name: Install TLS and WiFi build dependencies
        run: wf-pacman -Syu --noconfirm toolchain-gcc-arm-none-eabi-zlib blocksds-mbedtls blocksds-libcurl
      - name: Build automatic photo-game test app
        run: make -j2 PHOTO_NETWORK=1
      - uses: actions/upload-artifact@v4
        with:
          name: photo-worlds-online
          path: photo-worlds-online.nds
          if-no-files-found: error
  generation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test upload, package, native routes and explicit failures
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror source/generated_world.c source/generated_render.c tests/generated_check.c -lm -o /tmp/generated-check
          python3 -m unittest discover -s service -p test_service.py -v
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds@sha256:779f6193d1030c62e60d1f0f39c3e32cf4045c0bd224a45c0ceadf9d9ab01a51
    steps:
      - uses: actions/checkout@v4
      - name: Compile Nintendo DSi executable
        run: make -j2
      - uses: actions/upload-artifact@v4
        with:
          name: photo-worlds-dsi
          path: photo-worlds.nds
          if-no-files-found: error
  gameplay-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test movement, obstacles, failure and completion
        run: |
          cc -Wall -Wextra -Werror -fsanitize=address,undefined source/game.c tests/game_test.c -o /tmp/game-tests
          /tmp/game-tests
          cc -Wall -Wextra -Werror -fsanitize=address,undefined source/brooklyn.c source/calendar.c tests/brooklyn_test.c -lm -o /tmp/brooklyn-tests
          /tmp/brooklyn-tests
          cc -Wall -Wextra -Werror source/brooklyn.c tests/brooklyn_trace.c -lm -o /tmp/brooklyn-trace
          node tests/reference_parity.js /tmp/brooklyn-trace
          cc -Wall -Wextra -Werror -fsanitize=address,undefined source/brooklyn.c source/brooklyn_render.c tests/brooklyn_render_test.c -lm -o /tmp/render-tests
          /tmp/render-tests
          cc -Wall -Wextra -Werror -fsanitize=address,undefined source/brooklyn.c source/input_queue.c tests/input_timing_test.c -lm -o /tmp/timing-tests
          /tmp/timing-tests
